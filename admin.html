<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理员 · 学习笔记</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/category-and-detail.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
    <div class="admin-app">

        <!-- ===== 顶部导航栏 ===== -->
        <header class="admin-header">
            <div class="admin-header-left">
                <span class="admin-brand"><i class="fas fa-shield-alt"></i> 管理员</span>
                <span class="admin-current-student" id="admin-current-student">未选择</span>
            </div>
            <div class="admin-header-right">
                <select id="admin-student-select" aria-label="切换学生">
                    <option value="">-- 切换学生 --</option>
                </select>
                <button id="admin-add-student-btn" class="admin-btn admin-btn-add"><i class="fas fa-user-plus"></i>
                    新增</button>
                <button id="admin-save-btn" class="admin-btn admin-btn-save" disabled><i class="fas fa-save"></i>
                    已保存</button>
                <button id="admin-logout-btn" class="admin-btn admin-btn-logout"><i class="fas fa-sign-out-alt"></i>
                    退出</button>
            </div>
        </header>

        <!-- ===== 主体：侧边栏 + 内容 ===== -->
        <div class="admin-body">
            <!-- 侧边栏 -->
            <aside class="admin-sidebar">
                <nav class="admin-sidebar-nav">
                    <button class="admin-sidebar-btn is-active" data-panel="permission-panel">
                        <i class="fas fa-shield-alt"></i> 权限管理
                    </button>
                    <button class="admin-sidebar-btn" data-panel="review-panel">
                        <i class="fas fa-pen-nib"></i> 批阅中心
                    </button>
                    <button class="admin-sidebar-btn" data-panel="answer-panel">
                        <i class="fas fa-key"></i> 设置答案
                    </button>
                </nav>
                <!-- 侧边栏底部（可放置当前学生信息等） -->
                <div class="admin-sidebar-footer">
                    <span id="admin-sidebar-student">学生：未选择</span>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main class="admin-content">
                <!-- ========== 权限管理 ========== -->
                <section id="permission-panel" class="admin-panel is-active">
                    <h2 class="admin-title">权限管理</h2>
                    <div class="admin-controls">
                        <div class="control-group">
                            <label><i class="fas fa-book"></i> 选择科目：</label>
                            <div id="admin-permission-subject-buttons" class="subject-btn-group"></div>
                        </div>
                    </div>
                    <div id="admin-permission-tree" class="admin-tree">
                        <p class="tree-placeholder">请先选择学生和科目</p>
                    </div>
                    <div class="admin-tip">
                        <i class="fas fa-info-circle"></i> 勾选文章即授权该学生访问，取消勾选则禁止。修改后请点击「保存」。
                    </div>
                </section>

                <!-- ========== 批阅管理 ========== -->
                <section id="review-panel" class="admin-panel">
                    <h2 class="admin-title">批阅中心</h2>
                    <div class="admin-controls">
                        <div class="control-group">
                            <label><i class="fas fa-book"></i> 选择科目：</label>
                            <div id="admin-review-subject-buttons" class="subject-btn-group"></div>
                        </div>
                    </div>
                    <div id="admin-review-tree" class="admin-tree">
                        <p class="tree-placeholder">请先选择学生和科目</p>
                    </div>
                    <div class="admin-tip">
                        <i class="fas fa-info-circle"></i> 选择学生后点击文章，进入批阅页。题框会显示学生答案。
                    </div>
                </section>

                <!-- ========== 答案设置 ========== -->
                <section id="answer-panel" class="admin-panel">
                    <h2 class="admin-title">答案设置</h2>
                    <div class="admin-controls">
                        <div class="control-group">
                            <label><i class="fas fa-book"></i> 选择科目：</label>
                            <div id="admin-answer-subject-buttons" class="subject-btn-group"></div>
                        </div>
                    </div>
                    <div id="admin-answer-tree" class="admin-tree">
                        <p class="tree-placeholder">请先选择科目</p>
                    </div>
                    <div class="admin-tip">
                        <i class="fas fa-info-circle"></i> 点击文章后进入答案设置页，可填写标准答案并开启自动批阅。
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- 引入 Supabase 和业务逻辑 -->
    <script type="module" src="js/admin.js"></script>
</body>

</html>
