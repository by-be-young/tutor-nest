<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理员 · 学习笔记</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/category-and-detail.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
    <div class="admin-container">
        <!-- 导航栏 -->
        <nav class="admin-nav">
            <div class="admin-nav-left">
                <span class="admin-brand">🔐 管理员</span>
                <span class="admin-current-student" id="admin-current-student">未选择</span>
            </div>
            <div class="admin-nav-right">
                <button class="admin-btn admin-nav-tab is-active" data-panel="permission-panel"><i
                        class="fas fa-shield-alt"></i> 权限</button>
                <button class="admin-btn admin-nav-tab" data-panel="review-panel"><i class="fas fa-pen-nib"></i>
                    批阅</button>
                <button class="admin-btn admin-nav-tab" data-panel="answer-panel"><i class="fas fa-key"></i>
                    设置答案</button>
                <select id="admin-student-select" aria-label="切换学生">
                    <option value="">-- 切换学生 --</option>
                </select>
                <button id="admin-add-student-btn" class="admin-btn"><i class="fas fa-user-plus"></i> 新增</button>
                <button id="admin-save-btn" class="admin-btn admin-btn-save" disabled><i class="fas fa-save"></i>
                    已保存</button>
                <button id="admin-logout-btn" class="admin-btn admin-btn-logout"><i class="fas fa-sign-out-alt"></i>
                    退出</button>
            </div>
        </nav>

        <!-- 主体 -->
        <main class="admin-main">
            <!-- ========== 权限管理 ========== -->
            <section id="permission-panel" class="admin-panel is-active">
                <h2 class="admin-title">权限管理 — <span id="admin-student-name">选择学生</span></h2>
                <div class="admin-controls">
                    <div class="control-group">
                        <label><i class="fas fa-book"></i> 选择科目：</label>
                        <div id="admin-permission-subject-buttons" class="subject-btn-group"></div>
                    </div>
                </div>
                <div id="admin-permission-tree" class="admin-tree">
                    <p class="tree-placeholder">请先选择学生和科目</p>
                </div>
                <div class="admin-tip">
                    <i class="fas fa-info-circle"></i> 勾选文章即授权该学生访问，取消勾选则禁止。修改后请点击「保存」。
                </div>
            </section>

            <!-- ========== 批阅管理 ========== -->
            <section id="review-panel" class="admin-panel">
                <h2 class="admin-title">批阅中心 — <span id="admin-review-student-name">选择学生</span></h2>
                <div class="admin-controls">
                    <div class="control-group">
                        <label><i class="fas fa-book"></i> 选择科目：</label>
                        <div id="admin-review-subject-buttons" class="subject-btn-group"></div>
                    </div>
                </div>
                <div id="admin-review-tree" class="admin-tree">
                    <p class="tree-placeholder">请先选择学生和科目</p>
                </div>
                <div class="admin-tip">
                    <i class="fas fa-info-circle"></i> 选择学生后点击文章，进入批阅页。题框会显示学生答案。
                </div>
            </section>

            <!-- ========== 答案设置 ========== -->
            <section id="answer-panel" class="admin-panel">
                <h2 class="admin-title">答案设置 — <span id="admin-answer-subject-name">选择科目</span></h2>
                <div class="admin-controls">
                    <div class="control-group">
                        <label><i class="fas fa-book"></i> 选择科目：</label>
                        <div id="admin-answer-subject-buttons" class="subject-btn-group"></div>
                    </div>
                </div>
                <div id="admin-answer-tree" class="admin-tree">
                    <p class="tree-placeholder">请先选择科目</p>
                </div>
                <div class="admin-tip">
                    <i class="fas fa-info-circle"></i> 点击文章后进入答案设置页，可填写标准答案并开启自动批阅。
                </div>
            </section>
        </main>
    </div>

    <!-- 引入 Supabase 和业务逻辑 (使用 module) -->
    <script type="module" src="js/admin.js"></script>
</body>

</html>
