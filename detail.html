<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/category-and-detail.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>

    <!-- 导航栏（包含文章标题和模式） -->
    <nav class="navbar">
        <div class="nav-inner">
            <!-- 左侧：返回 -->
            <a href="javascript:history.back()" class="nav-logo">
                <i class="fas fa-arrow-left"></i> 返回
            </a>

            <!-- 中间：文章标题 + 模式 -->
            <div class="nav-center">
                <span class="nav-current-subject" id="nav-detail-title">加载中...</span>
                <span class="nav-detail-mode" id="nav-detail-mode"></span>
            </div>

            <!-- 右侧：用户状态 -->
            <div class="nav-right">
                <span id="nav-user-status" class="nav-user-status">未登录</span>
                <button id="nav-login-btn" class="nav-btn nav-btn-login">登录</button>
                <button id="nav-logout-btn" class="nav-btn nav-btn-logout" style="display:none;">退出</button>
            </div>
        </div>
    </nav>

    <!-- 详情主体 -->
    <div class="detail-container">
        <!-- 标题区（只保留标题，无 meta 和 actions） -->
        <div class="detail-title-area">
            <h1 class="detail-title" id="detail-title">加载中...</h1>
        </div>
        <div class="detail-body" id="detail-body"></div>
    </div>

    <!-- 悬浮按钮（提交/保存/批阅等） -->
    <div id="fab-container" class="fab-container">
        <button id="fab-submit" class="fab-btn" style="display: none;">
            <i class="fas fa-paper-plane"></i> 提交
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/drawing.js"></script>
    <script type="module" src="js/main.js"></script>
    <script src="js/katex-loader.js"></script>
</body>

</html>
