<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习资料仓库</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-inner">
            <span class="nav-logo">学习资料仓库</span>
            <div class="nav-right">
                <span id="nav-user-status" class="nav-user-status">未登录</span>
                <button id="nav-login-btn" class="nav-btn nav-btn-login">登录</button>
                <button id="nav-logout-btn" class="nav-btn nav-btn-logout" style="display:none;">退出</button>
            </div>
        </div>
    </nav>

    <!-- 主内容：flex 列，内容顶部，底部固定 -->
    <main class="main-content">

        <!-- 装饰圆点 -->
        <div class="deco-dot dot1"></div>
        <div class="deco-dot dot2"></div>

        <!-- 上部内容 -->
        <div class="content-top">
            <!-- 未登录：显示大标题 -->
            <div id="login-section" class="login-section">
                <h1 class="login-title">学习资料仓库</h1>
            </div>

            <!-- 已登录：学科卡片区域 -->
            <div id="logged-in-content" class="logged-in-content" style="display:none;">
                <div class="subject-cards-scroll" id="subject-cards-scroll">
                    <div class="subject-cards" id="subject-cards-container">
                        <!-- 由 home.js 动态渲染 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定区域：登录时显示统计，未登录显示登录表单 -->
        <div class="bottom-fixed">
            <!-- 统计信息（登录后显示） -->
            <div id="stats-area" class="stats-area" style="display:none;">
                <div class="stats-item">
                    <span class="stats-number" id="stats-subjects">0</span>
                    <span class="stats-label">门学科</span>
                </div>
                <div class="stats-divider"></div>
                <div class="stats-item">
                    <span class="stats-number" id="stats-articles">0</span>
                    <span class="stats-label">篇文章</span>
                </div>
            </div>

            <!-- 登录表单（未登录时显示） -->
            <form id="login-form" class="login-form" style="display:flex;">
                <input type="text" id="login-username" placeholder="你的用户名" required autofocus />
                <button type="submit" class="login-btn">进入</button>
                <button type="button" id="register-btn" class="register-btn">注册</button>
                <div id="login-error" class="login-error"></div>
            </form>
        </div>

    </main>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
            }
        }
    </script>
    <script type="module" src="js/home.js"></script>
</body>

</html>
